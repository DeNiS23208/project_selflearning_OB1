name: Django Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django requests

      - name: ⚙️ Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py migrate

      - name: 🚀 Run Django server (background)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 > server.log 2>&1 &
          # ждём пока порт откроется (до ~20 сек)
          for i in {1..20}; do
            nc -z 127.0.0.1 8000 && echo "Server is up" && break
            echo "Waiting for server... ($i)"
            sleep 1
          done
          # на всякий случай покажем последние строки лога
          tail -n 50 server.log || true

      - name: 🧪 Run tests (set BASE_URL for requests)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          BASE_URL: http://127.0.0.1:8000
        run: pytest -v
